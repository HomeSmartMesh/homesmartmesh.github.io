name: Deploy to GitHub Pages

# The site is rendered by the MicroWebStacks md-render engine
# (https://github.com/MicroWebStacks/astro-huge-doc), not by an Astro project
# checked into this repository. This repository owns content/, public/,
# manifest.yaml and this workflow; the renderer is pinned below and installed
# by the Action.

on:
  # Trigger the workflow every time you push to the `main` branch
  push:
    branches: [ main ]
  # Allows a render-only test run from any branch: the deploy job is gated to
  # main, so a branch run builds and uploads the artifact without publishing.
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4

      - name: Render static site
        id: render
        # Pinned to a SHA: astro-huge-doc has no release tags yet.
        uses: MicroWebStacks/astro-huge-doc@fc0d7d2314abcb46830708dde46de9b0d90049db
        with:
          # Exact @microwebstacks/md-render version. There is no default on
          # purpose: versions before 0.0.24 lack the `build` command the
          # Action calls.
          engine-version: '0.0.24'
          # Node 20 is deprecated on runners; the engine requires 22+ and the
          # Action rejects anything lower before it installs.
          node-version: '24'
          workspace: '.'
          out-dir: 'dist'
          # User/org Pages site, served from the domain root, so no `base`.
          site: 'https://homesmartmesh.github.io/'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.render.outputs.artifact-path }}

  deploy:
    needs: render
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
